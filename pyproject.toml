[project]
name = "rag-evals"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "OmRajput17", email = "rajputom2408@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.3.1",
    "deepevals>=0.2.0",
    "groq>=0.37.1",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.12",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag-evals = "rag_evals:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
